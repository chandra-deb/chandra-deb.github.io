<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
  <nav class="site-nav" aria-label="Primary">
    <a href="{{ '/' | relative_url }}">Posts</a>
    <a href="{{ '/tags/' | relative_url }}">Tags</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    <button class="theme-toggle" id="theme-toggle" type="button" hidden>
      <svg class="theme-icon theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
      </svg>
      <svg class="theme-icon theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
      </svg>
      <span id="theme-toggle-label">Dark mode</span>
    </button>
  </nav>
</header>
