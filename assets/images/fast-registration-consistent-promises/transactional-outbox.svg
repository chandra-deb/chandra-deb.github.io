<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc">
<title id="title">Commit the transition and its event together</title><desc id="desc">PROPOSED DESIGN · Database-owned transitions</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#50617b"/></marker></defs>
<rect width="760" height="580" rx="14" fill="#f7f9fc"/>
<text x="30" y="40" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#17243b" font-weight="650" text-anchor="start">Commit the transition and its event together</text>
<text x="30" y="69" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#50617b" font-weight="400" text-anchor="start">PROPOSED DESIGN · Database-owned transitions</text>
<rect x="65" y="110" width="630" height="175" rx="10" fill="#eef4ff" stroke="#245cc4" stroke-width="1.5"/>
<text x="90" y="143" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#245cc4" font-weight="650" text-anchor="start">ONE POSTGRESQL TRANSACTION</text>
<rect x="90" y="168" width="260" height="82" rx="10" fill="#eef4ff" stroke="#245cc4" stroke-width="1.5"/>
<text x="220.0" y="204.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#245cc4" font-weight="650" text-anchor="middle">Application row</text>
<text x="220.0" y="231.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#17243b" font-weight="400" text-anchor="middle">REGISTERED · version 4</text>
<rect x="405" y="168" width="260" height="82" rx="10" fill="#eef4ff" stroke="#245cc4" stroke-width="1.5"/>
<text x="535.0" y="204.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#245cc4" font-weight="650" text-anchor="middle">Outbox row</text>
<text x="535.0" y="231.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#17243b" font-weight="400" text-anchor="middle">Event ID · version 4</text>
<text x="380" y="277" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#245cc4" font-weight="650" text-anchor="middle">Both commit, or neither commits</text>
<polyline points="535,285 535,342" fill="none" stroke="#50617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="405" y="350" width="260" height="80" rx="10" fill="#eef4ff" stroke="#245cc4" stroke-width="1.5"/>
<text x="535.0" y="385.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#245cc4" font-weight="650" text-anchor="middle">Outbox relay</text>
<text x="535.0" y="412.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#17243b" font-weight="400" text-anchor="middle">Retry same event ID</text>
<polyline points="405,390 350,390" fill="none" stroke="#50617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="90" y="350" width="260" height="80" rx="10" fill="#e9f7f3" stroke="#087c72" stroke-width="1.5"/>
<text x="220.0" y="385.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#087c72" font-weight="650" text-anchor="middle">Redis projection</text>
<text x="220.0" y="412.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#17243b" font-weight="400" text-anchor="middle">Atomic version check</text>
<text x="380" y="484" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#17243b" font-weight="400" text-anchor="middle">Accept a valid newer version; reject stale updates.</text>
<text x="380" y="521" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#b24747" font-weight="650" text-anchor="middle">This does not protect an earlier Redis-only acknowledgment.</text>
<text x="380" y="551" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#50617b" font-weight="400" text-anchor="middle">Admission needs its own explicit durability contract.</text>
</svg>
