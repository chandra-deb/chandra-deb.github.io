<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" data-theme="light">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main class="site-main" id="main">
      {{ content }}
    </main>
    {% include footer.html %}
    {% if page.url == '/tags/' %}
      <script src="{{ '/assets/js/tags.js' | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>
