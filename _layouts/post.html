---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
      <span class="meta-sep" aria-hidden="true">·</span>
      <span>{{ content | strip_html | number_of_words | divided_by: 200.0 | ceil }} min read</span>
      {% if page.tags.size > 0 %}
        <span class="meta-sep" aria-hidden="true">·</span>
        <span class="post-tags">
          {% for tag in page.tags %}<a class="tag" href="{{ '/tags/' | relative_url }}?tag={{ tag | slugify }}">#{{ tag | escape }}</a> {% endfor %}
        </span>
      {% endif %}
    </div>
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/' | relative_url }}">← All posts</a>
  </footer>
</article>
